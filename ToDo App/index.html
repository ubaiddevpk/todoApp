<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">
  <div class="bg-white rounded-lg shadow-md p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold mb-4 text-center">Todo List</h1>
    
    <div class="flex flex-col gap-2 mb-4">
      <input id="taskInput" type="text" placeholder="Enter Task" class="border p-2 rounded w-full" />
      <input id="dateInput" type="date" class="border p-2 rounded w-full" />
      <button onclick="addTask()" class="bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Add Task</button>
    </div>

    <ul id="taskList" class="space-y-3"></ul>
  </div>

  <script src="./Script.js"></script>
</body>
</html>
